name: build-windows-sayplay

on:
  workflow_dispatch:
  push:
    branches:
      - sayplay

permissions:
  contents: write
  actions: read

# A newer push to the same branch supersedes an in-flight installer build.
concurrency:
  group: build-windows-sayplay-${{ github.ref }}
  cancel-in-progress: true

env:
  SAYPLAY_BUILD: "1"
  RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Increase pagefile size
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Syntax check cap-gpui (SayPlay)
        shell: bash
        run: ./scripts/check-sayplay-gpui-compile.sh --syntax-only x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-sayplay-release
          save-cache: true
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop-gpui -> target

      - uses: ./.github/actions/setup-js

      - name: Create .env file
        shell: bash
        run: |
          version="$(grep '^version = ' apps/desktop-gpui/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          {
            echo "appVersion=${version}"
            echo "VITE_ENVIRONMENT=production"
            echo "NEXT_PUBLIC_WEB_URL=https://cap.so"
            echo "NEXTAUTH_URL=https://cap.so"
            echo "VITE_OPENPANEL_CLIENT_ID="
            echo "VITE_OPENPANEL_API_URL="
            echo "VITE_SERVER_URL=https://cap.so"
            echo "RUST_TARGET_TRIPLE=x86_64-pc-windows-msvc"
          } > .env

      - name: Run cap-setup
        shell: bash
        run: bun run cap-setup
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
          SAYPLAY_BUILD: "1"

      - name: Typecheck cap-gpui (SayPlay)
        shell: bash
        env:
          SAYPLAY_BUILD: "1"
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: ./scripts/check-sayplay-gpui-compile.sh x86_64-pc-windows-msvc

      - name: Compile cap-gpui release
        shell: bash
        env:
          SAYPLAY_BUILD: "1"
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: ./scripts/build-gpui-binary.sh release x86_64-pc-windows-msvc

      - name: Build desktop binaries
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          SAYPLAY_BUILD: "1"
        run: ./scripts/build-desktop-binaries.sh x86_64-pc-windows-msvc

      - name: Build NSIS installer
        shell: bash
        env:
          SAYPLAY_BUILD: "1"
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/bundle-gpui.mjs x86_64-pc-windows-msvc --bundles nsis --skip-build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayplay-recorder-windows
          path: apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/sayplay'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^version = ' apps/desktop-gpui/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          tag="v${version}-sayplay.${{ github.run_number }}"
          installer="$(ls apps/desktop-gpui/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | head -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
          else
            gh release create "$tag" "$installer" \
              --title "SayPlay Recorder ${version}" \
              --notes "Windows installer (unsigned). Based on Cap (AGPLv3). Studio + Screenshot only; no Instant/cloud." \
              --draft
          fi
